<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">COLAPSO quantum provenance pipeline</title><desc id="desc">A provenance pipeline from IBM Quantum hardware jobs through preserved evidence, accepted entropy, deterministic expansion, and a replayable daily universe.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#07152e"/><stop offset="1" stop-color="#180b2b"/></linearGradient>
    <linearGradient id="rail"><stop stop-color="#a855f7"/><stop offset=".48" stop-color="#22d3ee"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.h{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.k{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#67e8f9}.b{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.s{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.n{font:800 18px 'Segoe UI',Arial,sans-serif;fill:#020617}</style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text x="80" y="78" class="k">QUANTUM PROVENANCE / RUN real-20260721t205417z</text><text x="80" y="128" class="h" font-size="40">From hardware evidence to one replayable universe</text>
  <text x="80" y="160" class="b">The quantum phase is preserved and auditable; deterministic compilation happens before the player loads the game.</text>
  <path d="M150 344H1450" stroke="url(#rail)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g>
    <g transform="translate(90 235)"><circle cx="60" cy="109" r="34" fill="#c084fc"/><text x="60" y="116" text-anchor="middle" class="n">1</text><text x="60" y="40" text-anchor="middle" class="k" fill="#d8b4fe">HARDWARE</text><rect y="150" width="220" height="170" rx="20" fill="#0b1226" stroke="#a855f7"/><text x="22" y="188" class="h">IBM ibm_fez</text><text x="22" y="220" class="b">Preserved circuits</text><text x="22" y="249" class="b">SamplerV2</text><text x="22" y="278" class="b">EstimatorV2</text><text x="22" y="304" class="s">2 provider job IDs</text></g>
    <g transform="translate(350 235)"><circle cx="60" cy="109" r="34" fill="#a855f7"/><text x="60" y="116" text-anchor="middle" class="n">2</text><text x="60" y="40" text-anchor="middle" class="k">EXPORT</text><rect y="150" width="220" height="170" rx="20" fill="#0b1226" stroke="#7c3aed"/><text x="22" y="188" class="h">Raw results</text><text x="22" y="220" class="b">Runtime payloads</text><text x="22" y="249" class="b">Result structure</text><text x="22" y="278" class="b">Submission record</text><text x="22" y="304" class="s">Before derivation</text></g>
    <g transform="translate(610 235)"><circle cx="60" cy="109" r="34" fill="#22d3ee"/><text x="60" y="116" text-anchor="middle" class="n">3</text><text x="60" y="40" text-anchor="middle" class="k">EVIDENCE</text><rect y="150" width="220" height="170" rx="20" fill="#0b1226" stroke="#22d3ee"/><text x="22" y="188" class="h">Evidence pack</text><text x="22" y="220" class="b">Manifest</text><text x="22" y="249" class="b">SHA-256 sums</text><text x="22" y="278" class="b">Provenance</text><text x="22" y="304" class="s">Integrity verifiable</text></g>
    <g transform="translate(870 235)"><circle cx="60" cy="109" r="34" fill="#22d3ee"/><text x="60" y="116" text-anchor="middle" class="n">4</text><text x="60" y="40" text-anchor="middle" class="k">DERIVATION</text><rect y="150" width="220" height="170" rx="20" fill="#0b1226" stroke="#22d3ee"/><text x="22" y="188" class="h">Accepted material</text><text x="22" y="220" class="b">1,024 entropy bits</text><text x="22" y="249" class="b">CHSH S = 2.6986</text><text x="22" y="278" class="b">SE = 0.1216</text><text x="22" y="304" class="s">Claims remain bounded</text></g>
    <g transform="translate(1130 235)"><circle cx="60" cy="109" r="34" fill="#67e8f9"/><text x="60" y="116" text-anchor="middle" class="n">5</text><text x="60" y="40" text-anchor="middle" class="k">EXPANSION</text><rect y="150" width="220" height="170" rx="20" fill="#0b1226" stroke="#22d3ee"/><text x="22" y="188" class="h">SHA-256 counter</text><text x="22" y="220" class="b">Domain separated</text><text x="22" y="249" class="b">Initial state</text><text x="22" y="278" class="b">Resolution plan</text><text x="22" y="304" class="s">Deterministic, not new entropy</text></g>
    <g transform="translate(1390 235)"><circle cx="60" cy="109" r="34" fill="#fbbf24"/><text x="60" y="116" text-anchor="middle" class="n">6</text><text x="60" y="40" text-anchor="middle" class="k" fill="#fde68a">UNIVERSE</text><rect x="-40" y="150" width="200" height="170" rx="20" fill="#0b1226" stroke="#fbbf24"/><text x="-18" y="188" class="h">REAL #001</text><text x="-18" y="220" class="b">7×7 board</text><text x="-18" y="249" class="b">F1 replay</text><text x="-18" y="278" class="b">Offline play</text><text x="-18" y="304" class="s">Commitment published</text></g>
  </g>
  <g transform="translate(90 652)">
    <rect width="1420" height="142" rx="24" fill="#070d1d" stroke="#334155"/>
    <text x="28" y="38" class="k">SCIENTIFIC GUARDRAILS</text>
    <text x="28" y="74" class="b">One-basis correlation is not by itself a Bell violation or conclusive entanglement certification.</text>
    <text x="28" y="104" class="b">CHSH is reported with propagated uncertainty; COLAPSO makes no device-independent, loophole-free, or quantum-advantage claim.</text>
  </g>
  <text x="80" y="850" class="s">Provider authorization may be required to inspect IBM job records. The repository preserves exported results and hashes for public audit.</text>
</svg>
