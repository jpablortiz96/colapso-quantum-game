name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-and-frontend:
    name: Public repository and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Verify public repository
        run: npm run verify:public-repo

      - name: Scan for secrets
        run: npm run scan:secrets

      - name: Verify production contract
        run: npm run verify:production

      - name: Verify Amplify package tooling
        run: npm run verify:amplify-package

      - name: Verify foundation and deterministic engine
        run: npm run verify:step0 && npm run verify:f1

      - name: Verify evidence and universe pipeline
        run: npm run verify:f2b && npm run verify:f3 && npm run verify:f4a

  quantum-tooling:
    name: Python quantum tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned package and test tools
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-cov==7.1.0 ruff==0.15.22

      - name: Lint
        run: ruff check .

      - name: Test with 75% combined coverage gate
        run: pytest

      - name: Verify F2A quantum boundary
        run: node ../scripts/verify-f2a.mjs
